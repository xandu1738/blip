<div class="px-4 flex justify-between">
  <div>
    <h1 class="text-3xl font-bold mb-2">Districts</h1>
    <p class="my-4">Manage Districts Details and Information</p>
  </div>
  <p-button
    (onClick)="addPartner()"
    icon="pi pi-plus"
    size="small"
    label="Add District"
  >
  </p-button>
</div>

<div class="p-4 w-full select-none relative">
  <div class="my-3">
    <p-accordion value="0">
      <p-accordion-panel value="0">
        <p-accordion-header>Filter</p-accordion-header>
        <p-accordion-content>
          <div class="p-6 mb-6">
            <div class="flex justify-between gap-1.5 my-3">
              <p-floatlabel class="mt-3 md:w-1/3 sm:w-full xs:w-full">
                <label for="search_name" class="block text-sm font-medium mb-1">District Name</label>
                <input
                  pInputText
                  type="text"
                  id="search_name"
                  [(ngModel)]="userData.district_name"
                  class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                />
              </p-floatlabel>
              <p-floatlabel class="mt-3 md:w-1/3 sm:w-full xs:w-full">
                <label for="acc" class="block text-sm font-medium mb-1">Region</label>
                <input
                  pInputText
                  type="text"
                  id="acc"
                  [(ngModel)]="userData.region"
                  class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                />
              </p-floatlabel>
              <p-floatlabel class="mt-3 md:w-1/3 sm:w-full xs:w-full">
                <label for="bref" class="block text-sm font-medium mb-1">Code</label>
                <input
                  pInputText
                  type="text"
                  id="bref"
                  [(ngModel)]="userData.code"
                  class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                />
              </p-floatlabel>
            </div>
            <div class="flex justify-end pt-2">
              <p-button
                (onClick)="filterPartners()"
                icon="pi pi-search"
                label="Search"
                size="small"
                severity="primary"
              >
              </p-button>
            </div>
          </div>
        </p-accordion-content>
      </p-accordion-panel>
    </p-accordion>
  </div>

  <!-- Districts Table -->
  <div class="relative shadow-sm border border-gray-200 overflow-y-auto">
    <p-table
      [value]="filteredPartners"
      class="small-word-grid"
      [rows]="15"
      [paginator]="true"
      [pageLinks]="5"
      [lazy]="true"
      [rowsPerPageOptions]="[15, 20, 50, 100]"
      (onLazyLoad)="loadLazy($event)"
      [totalRecords]="search.totalRecords"
      [resizableColumns]="true"
      [tableStyle]="{ 'min-width': '100%' }"
      stripedRows>
      <ng-template pTemplate="header">
        <tr>
          <th id="districtName" style="width: 25%">District Name</th>
          <th id="region" style="width: 20%">Region</th>
          <th id="code" style="width: 15%">Code</th>
          <th id="active" style="width: 15%">Status</th>
          <th id="act" style="width: 25%">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-district>
        <tr>
          <td class="truncate">{{ district?.district_name || '---' }}</td>
          <td class="truncate">{{ district?.region || '---' }}</td>
          <td class="truncate">{{ district?.code || '---' }}</td>
          <td class="truncate">
            @if (district?.active) {
              <span class="px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded-full">Active</span>
            } @else {
              <span class="px-2 py-1 text-xs bg-gray-100 text-red-700 rounded-full">Inactive</span>
            }
          </td>
          <td class="truncate">
            <div class="flex gap-2">
              <p-button size="small" [rounded]="true" severity="primary" icon="pi pi-eye" [outlined]="true"
                        pTooltip="View District" tooltipPosition="bottom"></p-button>
              <p-button size="small" [rounded]="true" severity="info" icon="pi pi-pencil" [outlined]="true"
                        pTooltip="Edit District" tooltipPosition="bottom"></p-button>
              <p-button size="small" [rounded]="true" severity="warn" icon="pi pi-trash" [outlined]="true"
                        pTooltip="Archive District" tooltipPosition="bottom"></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <!-- Add District Dialog -->
  <p-dialog
    header="Add New District"
    [(visible)]="showAddDialog"
    [modal]="true"
    [style]="{ width: '500px' }"
    [closable]="true">

    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="district_name" class="block font-medium mb-2">District Name</label>
          <input
            id="district_name"
            type="text"
            pInputText
            [(ngModel)]="partnerDetails.district_name"
            placeholder="Enter district name"
            class="w-full p-3"/>
        </div>
        <div>
          <label for="region" class="block font-medium mb-2">Region</label>
          <input
            id="region"
            type="text"
            pInputText
            [(ngModel)]="partnerDetails.region"
            placeholder="Enter region"
            class="w-full p-3"/>
        </div>
      </div>

      <div>
        <label for="code" class="block font-medium mb-2">District Code</label>
        <input
          id="code"
          type="text"
          pInputText
          [(ngModel)]="partnerDetails.code"
          placeholder="e.g. DST-001"
          class="w-full p-3"/>
      </div>

      <div>
        <label for="description" class="block font-medium mb-2">Description</label>
        <textarea
          pInputText
          id="description"
          [(ngModel)]="partnerDetails.bio"
          rows="3"
          placeholder="Brief description of the district..."
          class="w-full p-3"></textarea>
      </div>

      <div class="flex items-center gap-3 pt-4 border-t border-gray-200">
        <input type="checkbox" id="activeCheck" class="rounded" [(ngModel)]="partnerDetails.active">
        <label for="activeCheck" class="text-sm">Activate district immediately</label>
      </div>

      <div class="flex justify-end gap-3 mt-6">
        <p-button
          label="Cancel"
          icon="pi pi-times"
          severity="secondary"
          size="small"
          (onClick)="showAddDialog = false">
        </p-button>
        <p-button
          label="Create District"
          icon="pi pi-check"
          severity="success"
          size="small"
          (onClick)="registerPartner()">
        </p-button>
      </div>
    </div>

  </p-dialog>
</div>
