<div class="card p-6 rounded-2xl shadow-sm border border-gray-100 bg-[var(--card)]">
  <h2 class="text-xl font-bold mb-4">{{ isEditMode ? 'Edit Vehicle' : 'Add New Vehicle' }}</h2>

  <div class="flex flex-col gap-2">
    <label for="regNumber">Registration Number</label>
    <input pInputText id="regNumber" [(ngModel)]="vehicle.registration_number"
           placeholder="Enter registration number"/>
  </div>

  <div class="flex flex-col gap-2">
    <label for="type">Vehicle Type</label>
    <p-autoComplete id="type" [suggestions]="filteredTypes"
                    dropdown="true"
                    (completeMethod)="searchVehicleTypes($event)"
                    [(ngModel)]="vehicle.type" placeholder="Select a type"
                    class="w-full" [style]="{'width':'100%'}"></p-autoComplete>
  </div>

  <div class="flex flex-col gap-2">
    <label for="capacity">Capacity</label>
    <p-inputNumber id="capacity" [(ngModel)]="vehicle.capacity" [min]="1" placeholder="Enter capacity"
                   class="w-full" [style]="{'width':'100%'}"></p-inputNumber>
  </div>

  @if (isEditMode) {
    <div class="flex flex-col gap-2">
      <label for="status">Status</label>
      <p-autoComplete id="status" [suggestions]="filteredStatuses" [(ngModel)]="vehicle.status"
                      (completeMethod)="search($event)" dropdown="true"
                      placeholder="Select status"
                      class="w-full" [style]="{'width':'100%'}"></p-autoComplete>
    </div>
  }


  <div class="flex justify-end gap-3 mt-4">
    <p-button label="Cancel" severity="secondary" (onClick)="cancel()"></p-button>
    <p-button label="Save" (onClick)="saveVehicle()"></p-button>
  </div>
</div>
