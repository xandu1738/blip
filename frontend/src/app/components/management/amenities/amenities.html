<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Vehicle Amenities</h1>
    <p-button label="Add Amenity" icon="pi pi-plus" size="small" (onClick)="showAddDialog = true"></p-button>
  </div>

  <p-table [value]="amenities" [paginator]="true" [rows]="10">
    <ng-template pTemplate="header">
      <tr>
        <th id="name">Name</th>
        <th id="code">Code</th>
        <th id="description">Description</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-amenity>
      <tr>
        <td>{{ amenity.name }}</td>
        <td><code>{{ amenity.code }}</code></td>
        <td>{{ amenity.description }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center p-4">No amenities found.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog header="Add New Amenity" [(visible)]="showAddDialog" [modal]="true" [style]="{width: '450px'}">
    <div class="flex flex-col gap-4 mt-2">
      <div class="flex flex-col gap-2">
        <label for="name_">Name</label>
        <input pInputText id="name_" [(ngModel)]="newAmenity.name" placeholder="e.g. WiFi, Air Conditioning"/>
      </div>
      <div class="flex flex-col gap-2">
        <label for="description_">Description</label>
        <input pInputText id="description_" [(ngModel)]="newAmenity.description" placeholder="Short description"/>
      </div>
    </div>
    <ng-template pTemplate="footer">
      <button pButton label="Cancel" icon="pi pi-times" class="p-button-text" (click)="showAddDialog = false"></button>
      <button pButton label="Save" icon="pi pi-check" (click)="saveAmenity()"></button>
    </ng-template>
  </p-dialog>
</div>
