<div class="mx-auto p-6">
    <div class="flex items-center gap-4 mb-8">
        <p-button icon="pi pi-arrow-left" [rounded]="true" [text]="true" severity="secondary"
            (onClick)="cancel()"></p-button>
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ isEditMode ? 'Edit Trip Instance' : 'Record
                Trip Instance' }}</h1>
            <p class="text-gray-500 dark:text-gray-400 font-medium">Assign vehicle and driver to fulfill a schedule</p>
        </div>
    </div>

    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Schedule -->
            <div class="flex flex-col gap-2">
                <label for="schedule" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Schedule</label>
                <p-select id="schedule" [options]="schedules" [(ngModel)]="trip.schedule_id"
                    placeholder="Select Schedule" class="w-full" [filter]="true"
                    [disabled]="!!trip.schedule_id && !isEditMode"></p-select>
            </div>

            <!-- Date -->
            <div class="flex flex-col gap-2">
                <label for="date" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Trip Date</label>
                <p-datepicker id="date" [(ngModel)]="trip.trip_date" dateFormat="yy-mm-dd" placeholder="Select Date"
                    [style]="{'width':'100%'}" class="w-full"></p-datepicker>
            </div>

            <!-- Vehicle -->
            <div class="flex flex-col gap-2">
                <label for="vehicle" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Assigned
                    Vehicle</label>
                <p-select id="vehicle" [options]="vehicles" [(ngModel)]="trip.bus_id" placeholder="Select Vehicle"
                    class="w-full" [filter]="true"></p-select>
            </div>

            <!-- Driver -->
            <div class="flex flex-col gap-2">
                <label for="driver" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Assigned
                    Driver</label>
                <p-select id="driver" [options]="drivers" [(ngModel)]="trip.driver_id" placeholder="Select Driver"
                    class="w-full" [filter]="true"></p-select>
            </div>

            <!-- Set Off Time -->
            <div class="flex flex-col gap-2">
                <label for="set_off_time" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Set Off
                    Time</label>
                <p-datepicker id="set_off_time" [(ngModel)]="trip.set_off_time" [timeOnly]="true" hourFormat="24"
                    [style]="{'width':'100%'}" class="w-full"></p-datepicker>
            </div>

            <!-- Estimated Arrival Time -->
            <div class="flex flex-col gap-2">
                <label for="arrival_time" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Estimated
                    Arrival Time</label>
                <p-datepicker id="arrival_time" [(ngModel)]="trip.estimated_arrival_time" [timeOnly]="true"
                    hourFormat="24" [style]="{'width':'100%'}" class="w-full"></p-datepicker>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-gray-100 dark:border-gray-700">
            <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()"></p-button>
            <p-button [label]="isEditMode ? 'Update Trip' : 'Record Trip'"
                [icon]="isEditMode ? 'pi pi-check' : 'pi pi-play'" (onClick)="saveTrip()"
                [disabled]="!trip.schedule_id || !trip.bus_id || !trip.trip_date || !trip.driver_id"></p-button>
        </div>
    </div>
</div>
