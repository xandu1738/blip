<div class="mx-auto p-6">
  <div class="flex items-center gap-4 mb-8">
    <p-button icon="pi pi-arrow-left" [rounded]="true" [text]="true" severity="secondary"
      (onClick)="cancel()"></p-button>
    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{
        isEditMode ? 'Edit Schedule' : 'New
        Schedule'
        }}</h1>
      <p class="text-gray-500 dark:text-gray-400 font-medium">Configure trip details for your fleet</p>
    </div>
  </div>

  <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <!-- Route -->
      <div class="flex flex-col gap-2">
        <label for="route" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Route</label>
        <p-select id="route" [options]="routes" [(ngModel)]="schedule.route_id" placeholder="Select Route"
          class="w-full" [filter]="true"></p-select>
      </div>

      <!-- Days of Week -->
      <div class="flex flex-col gap-2">
        <label for="days" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Recurring Days</label>
        <p-multiselect id="days" [options]="daysOptions" [(ngModel)]="schedule.days_of_week" placeholder="Select Days"
          class="w-full" display="chip"></p-multiselect>
      </div>

      <!-- Set Off Time -->
      <div class="flex flex-col gap-2">
        <label for="set_off_time" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Set Off Time</label>
        <p-datepicker id="set_off_time" [(ngModel)]="schedule.set_off_time" [timeOnly]="true" hourFormat="24"
          placeholder="Select Set Off Time" [style]="{'width':'100%'}" class="w-full"></p-datepicker>
      </div>

      <!-- Expected Arrival Time -->
      <div class="flex flex-col gap-2">
        <label for="arrival_time" class="text-sm font-semibold text-gray-700 dark:text-gray-300">Expected Arrival
          Time</label>
        <p-datepicker id="arrival_time" [(ngModel)]="schedule.expected_arrival_time" [timeOnly]="true" hourFormat="24"
          placeholder="Select Arrival Time" [style]="{'width':'100%'}" class="w-full"></p-datepicker>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-gray-100 dark:border-gray-700">
      <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()"></p-button>
      <p-button [label]="isEditMode ? 'Update Schedule' : 'Create Schedule'"
        [icon]="isEditMode ? 'pi pi-check' : 'pi pi-plus'" (onClick)="saveSchedule()"
        [disabled]="!schedule.route_id || !schedule.days_of_week || schedule.days_of_week.length === 0"></p-button>
    </div>
  </div>
</div>
