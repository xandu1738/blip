<div class="p-6">
    <div class="flex items-center gap-4 mb-8">
        <p-button icon="pi pi-arrow-left" [rounded]="true" [text]="true" severity="secondary"
            (onClick)="cancel()"></p-button>
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Create New Consignment</h1>
            <p class="text-gray-500 dark:text-gray-400 font-medium">Set up a new shipment for distribution</p>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Logistics Planning -->
        <div
            class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm md:col-span-2">
            <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                <i class="pi pi-map text-blue-600"></i> Route & Logistics
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-gray-700 dark:text-gray-300">Origin District</label>
                    <p-select [options]="districts" [(ngModel)]="consignment.origin" placeholder="Select origin"
                        class="w-full"></p-select>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-gray-700 dark:text-gray-300">Destination District</label>
                    <p-select [options]="districts" [(ngModel)]="consignment.destination"
                        placeholder="Select destination" class="w-full"></p-select>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-gray-700 dark:text-gray-300">Assigned Vehicle</label>
                    <p-select [options]="vehicles" [(ngModel)]="consignment.vehicleId" placeholder="Select vehicle"
                        class="w-full"></p-select>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-gray-700 dark:text-gray-300">Schedule ID (Optional)</label>
                    <input pInputText type="number" [(ngModel)]="consignment.scheduleId" placeholder="Enter schedule ID"
                        class="w-full" />
                </div>
            </div>
        </div>
    </div>

    <div class="mt-8 flex justify-end gap-3 border-t pt-6 border-gray-100 dark:border-gray-700">
        <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="cancel()"></p-button>
        <p-button label="Create Consignment" icon="pi pi-check" severity="primary"
            (onClick)="saveConsignment()"></p-button>
    </div>
</div>
