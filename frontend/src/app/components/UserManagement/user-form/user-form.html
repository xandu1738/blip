<div class="flex flex-col justify-start items-start mb-4">
  <h1 class="text-3xl font-bold mb-2">User Details</h1>
  <p class="mb-4">Manage User Details and Information</p>
</div>

<div class="card p-6 rounded-2xl shadow-sm border border-gray-100 bg-[var(--card)]">
  <div class="grid grid-cols-1 md:grid-cols-12 gap-6">

    <!-- Partner Picker Section -->
    <div class="col-span-12 md:col-span-9">
      <label class="block font-medium mb-2 text-sm text-[var(--text)] opacity-80">Partner Organization</label>
      <app-partner-picker (onSelected)="setPartner($event)" class="w-full"></app-partner-picker>
    </div>

    <div class="col-span-12 md:col-span-3 flex items-end">
      <p-button label="New Partner" icon="pi pi-plus" styleClass="w-full p-button-outlined" size="small">
      </p-button>
    </div>

    <!-- Role Picker -->
    <div class="col-span-12 md:col-span-12">
      <label class="block font-medium mb-2 text-sm text-[var(--text)] opacity-80">User Role</label>
      <app-role-picker (onSelected)="selectRole($event)" class="w-full"></app-role-picker>
    </div>

    <!-- First Name -->
    <div class="col-span-12 md:col-span-6">
      <label for="f_name" class="block font-medium mb-2 text-sm text-[var(--text)] opacity-80">First Name</label>
      <p-iconfield iconPosition="left" class="w-full">
        <p-inputicon styleClass="pi pi-user" />
        <input id="f_name" type="text" pInputText placeholder="John" [(ngModel)]="userDetails.first_name"
          class="w-full pl-10" /> <!-- pl-10 to account for icon if needed, though IconField handles it usually -->
      </p-iconfield>
    </div>

    <!-- Last Name -->
    <div class="col-span-12 md:col-span-6">
      <label for="l_name" class="block font-medium mb-2 text-sm text-[var(--text)] opacity-80">Last Name</label>
      <p-iconfield iconPosition="left" class="w-full">
        <p-inputicon styleClass="pi pi-user" />
        <input id="l_name" type="text" pInputText placeholder="Doe" [(ngModel)]="userDetails.last_name"
          class="w-full" />
      </p-iconfield>
    </div>

    <!-- Email -->
    <div class="col-span-12 md:col-span-6">
      <label for="em" class="block font-medium mb-2 text-sm text-[var(--text)] opacity-80">Email Address</label>
      <p-iconfield iconPosition="left" class="w-full">
        <p-inputicon styleClass="pi pi-envelope" />
        <input pInputText id="em" type="email"
               autocomplete="off"
               placeholder="john.doe@example.com" [(ngModel)]="userDetails.email"
          class="w-full" />
      </p-iconfield>
    </div>

    <!-- Phone -->
    <div class="col-span-12 md:col-span-6">
      <label for="ph" class="block font-medium mb-2 text-sm text-[var(--text)] opacity-80">Phone Number</label>
      <p-iconfield iconPosition="left" class="w-full">
        <p-inputicon styleClass="pi pi-phone" />
        <input pInputText id="ph" type="tel" placeholder="07********"
               autocomplete="off" pattern="[0-9]{10}"
               [(ngModel)]="userDetails.phone_number"
          class="w-full" />
      </p-iconfield>
    </div>

    <!-- Password -->
    <div class="col-span-12 md:col-span-6">
      <label for="pwd" class="block font-medium mb-2 text-sm text-[var(--text)] opacity-80">Password</label>
      <p-iconfield iconPosition="left" class="w-full">
        <p-inputicon styleClass="pi pi-lock" />
        <input pInputText id="pwd" type="password" autocomplete="new-password" placeholder="••••••••" [(ngModel)]="userDetails.password"
          class="w-full" />
      </p-iconfield>
    </div>

    <!-- Confirm Password -->
    <div class="col-span-12 md:col-span-6">
      <label for="pwd1" class="block font-medium mb-2 text-sm text-[var(--text)] opacity-80">Confirm Password</label>
      <p-iconfield iconPosition="left" class="w-full">
        <p-inputicon styleClass="pi pi-lock" />
        <input pInputText id="pwd1" type="password" autocomplete="new-password" placeholder="••••••••" [(ngModel)]="userDetails.password1"
          class="w-full" />
      </p-iconfield>
    </div>

    <!-- Action Buttons -->
    <div class="col-span-12 flex justify-end gap-3 mt-4 pt-4 border-t border-gray-100">
      <p-button label="Cancel" styleClass="p-button-text p-button-secondary" size="small">
      </p-button>
      <p-button label="Create Account" icon="pi pi-check" size="small" styleClass="primary-button"
                [disabled]="!this.userDetails.password || (this.userDetails.password !== this.userDetails.password1)"
        (onClick)="registerUser()">
      </p-button>
    </div>

  </div>
</div>

<p-toast position="bottom-right"></p-toast>
