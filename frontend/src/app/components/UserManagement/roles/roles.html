<div class="px-4 flex justify-between">
  <div>
    <h1 class="text-3xl font-bold mb-2">Role Management</h1>
    <p class="my-4">Manage Account Access Level Information</p>
  </div>
  <p-button (onClick)="addRole()" icon="pi pi-plus" size="small" label="Add User">
  </p-button>
</div>

<div class="p-4 w-full select-none relative">
  <div class="my-3">
    <p-accordion value="0">
      <p-accordion-panel value="0">
        <p-accordion-header>Filter</p-accordion-header>
        <p-accordion-content>
          <!-- Search Filters Card -->
          <div class="p-6 mb-6">
            <div class="flex flex-col lg:flex-row lg:gap-4 my-3">
              <!-- Partner Name -->
              <div class="w-full lg:w-1/3 mb-4 lg:mb-0">
                <label for="search_name" class="block text-sm font-medium mb-1 pl-1">Role Name</label>
                <input pInputText type="text" id="search_name" placeholder="Search by Name" [(ngModel)]="roleData.name"
                       class="w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
              </div>

              <div class="w-full lg:w-1/3 mb-4 lg:mb-0">
                <label for="acc" class="block text-sm font-medium mb-1 pl-1">Role Code</label>
                <input pInputText type="text" id="acc" placeholder="Search by Code" [(ngModel)]="roleData.roleCode"
                       class="w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
              </div>

              <div class="w-full lg:w-1/3 mb-4 lg:mb-0">
                <label class="block text-sm font-medium mb-1 pl-1">Role</label>
                <app-domain-picker (onSelected)="onSelectDomain($event)">
                </app-domain-picker>
              </div>
            </div>
            <!-- Search Button -->
            <div class="flex justify-end pt-2">
              <p-button (onClick)="filterRoles()" icon="pi pi-search" label="Search" size="small" severity="primary">
              </p-button>
            </div>

          </div>

        </p-accordion-content>
      </p-accordion-panel>

    </p-accordion>
  </div>

  <p-table [value]="roles" [paginator]="true" showGridlines [rows]="15" lazy="true"
           [totalRecords]="search.totalRecords" (onLazyLoad)="loadLazy($event)" [tableStyle]="{ 'min-width': '50rem' }"
           [rowsPerPageOptions]="[15, 20,50,100]">
    <ng-template #header>
      <tr>
        <th id="roleName">Role Name</th>
        <th id="roleCode">Role Code</th>
        <th id="roleDomain">Domain</th>
        <th id="createdAt">Added On</th>
      </tr>
    </ng-template>
    <ng-template #body let-customer>
      <tr>
        <td>{{ customer?.roleName || '---' }}</td>
        <td>{{ customer?.roleCode || '---' }}</td>
        <td>{{ customer?.roleDomain || '---' }}</td>
        <td>{{ customer?.createdAt || '---' }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
